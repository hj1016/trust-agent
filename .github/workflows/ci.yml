name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-contracts:
    name: Python contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt --requirement apps/ai-service/requirements-ai.txt

      - name: Run contract and unit tests
        env:
          TRUSTAGENT_PRIVATE_ARTIFACT_ROOT: ${{ runner.temp }}/trust-agent-private-artifacts
        # 저장소 루트를 top-level로 둔다(-t .). 시작 디렉터리만 쓰면 tests/ai_service가 패키지 ai_service를 가려 import가 깨진다.
        run: python -m unittest discover -s tests -t . -v

      - name: Validate JSON documents
        run: find contracts datasets -type f -name '*.json' -print0 | xargs -0 -n1 python -m json.tool >/dev/null

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Reject private or generated files
        shell: bash
        run: |
          forbidden_files="$({ git ls-files | grep -E '(^|/)(\.private-artifacts/|datasets/public/kb/snapshots/|\.idea/|__pycache__/|.*\.pyc$|.*\.html$|\.env($|\.))' || true; } | grep -v -E '(^|/)\.env\.example$' || true)"
          if [[ -n "${forbidden_files}" ]]; then
            echo "Git에 포함할 수 없는 파일이 발견됐습니다."
            echo "${forbidden_files}"
            exit 1
          fi

  gradle-tests:
    name: Gradle tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          echo "7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check --strict

      - name: Set up Python for AI service integration
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run Gradle tests and build executable jar
        # TASK-015: Core(Java)와 AI 서비스(Python CLI)를 함께 실행하는 연결 검증을 필수 CI에서 실제로 실행한다.
        # TRUST_AGENT_REQUIRE_AI_INTEGRATION=1이면 건너뜀이 허용되지 않으며 환경 누락은 실패로 드러난다.
        env:
          TRUST_AGENT_REQUIRE_AI_INTEGRATION: "1"
        run: ./gradlew test bootJar --no-daemon -PaiServiceIntegration=true

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks with pinned version and checksum
        # TASK-020: 바이너리 버전과 sha256을 고정한다. 체크섬이 다르면 설치 단계에서 실패한다.
        # 로컬 pre-commit hook(gitleaks-system)과 같은 `gitleaks git` 검사를 CI에서 전체 이력에 실행한다.
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          expected_sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSL --retry 3 --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          echo "${expected_sha256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          echo "${RUNNER_TEMP}/gitleaks" >> "${GITHUB_PATH}"

      - name: Scan git history and tracked files
        # 탐지 값은 --redact로 가려지고 규칙 ID, 커밋, 파일, 줄만 출력된다. allowlist 설정 파일은 두지 않는다.
        run: gitleaks git --redact --no-banner --exit-code 1 --verbose .
