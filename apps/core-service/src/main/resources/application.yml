spring:
  application:
    name: trust-agent-core-service
  datasource:
    url: ${TRUST_AGENT_DB_URL:jdbc:postgresql://localhost:5432/trust_agent}
    username: ${TRUST_AGENT_DB_USERNAME:trust_agent_runtime_user}
    password: ${TRUST_AGENT_DB_PASSWORD:}
  flyway:
    enabled: ${TRUST_AGENT_FLYWAY_ENABLED:false}
    clean-disabled: true

trust-agent:
  datasource:
    connection-timeout: ${TRUST_AGENT_DB_CONNECTION_TIMEOUT:2s}
    validation-timeout: ${TRUST_AGENT_DB_VALIDATION_TIMEOUT:1s}
    statement-timeout: ${TRUST_AGENT_DB_STATEMENT_TIMEOUT:5s}
    readiness-query-timeout: ${TRUST_AGENT_DB_READINESS_QUERY_TIMEOUT:1s}
    maximum-pool-size: ${TRUST_AGENT_DB_MAX_POOL_SIZE:5}
  schema:
    expected-version: ${TRUST_AGENT_SCHEMA_EXPECTED_VERSION:1}

management:
  server:
    address: ${TRUST_AGENT_MANAGEMENT_ADDRESS:127.0.0.1}
    port: ${TRUST_AGENT_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-components: always
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,databaseConnectivity,schemaCompatibility
