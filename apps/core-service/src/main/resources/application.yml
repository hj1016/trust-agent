spring:
  application:
    name: trust-agent-core-service
  datasource:
    url: ${TRUST_AGENT_DB_URL:jdbc:postgresql://localhost:5432/trust_agent}
    username: ${TRUST_AGENT_DB_USERNAME:trust_agent_runtime_user}
    password: ${TRUST_AGENT_DB_PASSWORD:}
  flyway:
    enabled: ${TRUST_AGENT_FLYWAY_ENABLED:false}
    clean-disabled: true

server:
  servlet:
    session:
      # 세션 만료(ADR-014 13항): 유휴 8시간(설정값). 절대 만료 24시간은 TASK-026에서 다룬다.
      timeout: ${TRUST_AGENT_SESSION_IDLE_TIMEOUT:8h}
      cookie:
        http-only: true
        same-site: lax
        secure: ${TRUST_AGENT_SESSION_COOKIE_SECURE:false}

trust-agent:
  control-datasource:
    # 제어 DB(ADR-014): 사용자·역할·보안 사건·AI 요청 승인. cloud/prod는 업무 DB와 다른 데이터베이스를 요구한다.
    # 로컬 기본값은 업무 DB 설정으로 대체되며 같은 DB 안에 별도 Flyway history(flyway_control_schema_history)로 만들어진다.
    url: ${TRUST_AGENT_CONTROL_DB_URL:${spring.datasource.url}}
    username: ${TRUST_AGENT_CONTROL_DB_USERNAME:${spring.datasource.username}}
    password: ${TRUST_AGENT_CONTROL_DB_PASSWORD:${spring.datasource.password}}
    flyway-enabled: ${TRUST_AGENT_CONTROL_FLYWAY_ENABLED:${spring.flyway.enabled}}
    maximum-pool-size: ${TRUST_AGENT_CONTROL_DB_MAX_POOL_SIZE:2}
  demo-users:
    # 합성 직원 3명 적재 명령(demo 전용). 비밀번호는 TRUST_AGENT_DEMO_PASSWORD_<사용자 ID>(- 대신 _) 환경변수로만 받는다.
    enabled: false
  public-evidence:
    freshness-policy-version: ${TRUST_AGENT_FRESHNESS_POLICY_VERSION:public-evidence-confirmation-v1}
    max-confirmation-age: ${TRUST_AGENT_MAX_CONFIRMATION_AGE:24h}
  internal-policy:
    business-timezone: ${TRUST_AGENT_INTERNAL_BUSINESS_TIMEZONE:Asia/Seoul}
    timezone-policy-version: ${TRUST_AGENT_INTERNAL_TIMEZONE_POLICY_VERSION:internal-business-time-v1}
  synthetic-internal-import:
    enabled: false
    datasource:
      url: ${TRUST_AGENT_SYNTHETIC_IMPORT_DB_URL:${spring.datasource.url}}
      username: ${TRUST_AGENT_SYNTHETIC_IMPORT_DB_USERNAME:${spring.datasource.username}}
      password: ${TRUST_AGENT_SYNTHETIC_IMPORT_DB_PASSWORD:${spring.datasource.password}}
  baseline-import:
    enabled: false
    datasource:
      url: ${TRUST_AGENT_IMPORT_DB_URL:${spring.datasource.url}}
      username: ${TRUST_AGENT_IMPORT_DB_USERNAME:${spring.datasource.username}}
      password: ${TRUST_AGENT_IMPORT_DB_PASSWORD:${spring.datasource.password}}
      connection-timeout: ${TRUST_AGENT_IMPORT_DB_CONNECTION_TIMEOUT:5s}
      validation-timeout: ${TRUST_AGENT_IMPORT_DB_VALIDATION_TIMEOUT:2s}
      statement-timeout: ${TRUST_AGENT_IMPORT_DB_STATEMENT_TIMEOUT:30s}
      maximum-pool-size: ${TRUST_AGENT_IMPORT_DB_MAX_POOL_SIZE:2}
  datasource:
    connection-timeout: ${TRUST_AGENT_DB_CONNECTION_TIMEOUT:2s}
    validation-timeout: ${TRUST_AGENT_DB_VALIDATION_TIMEOUT:1s}
    statement-timeout: ${TRUST_AGENT_DB_STATEMENT_TIMEOUT:5s}
    readiness-query-timeout: ${TRUST_AGENT_DB_READINESS_QUERY_TIMEOUT:1s}
    maximum-pool-size: ${TRUST_AGENT_DB_MAX_POOL_SIZE:5}
  proposal-generation:
    enabled: false
    generator-version: ${TRUST_AGENT_PROPOSAL_GENERATOR_VERSION:proposal-generator-v1}
  fixture-approved-checklist:
    enabled: false
  proposal-validation:
    enabled: false
    validator-version: ${TRUST_AGENT_PROPOSAL_VALIDATOR_VERSION:proposal-validator-v1}
  human-review:
    enabled: false
  tool-api:
    # AI 서비스용 Tool API test/demo 인증. 실제 값은 환경변수로만 제공한다. 비어 있으면 모든 Tool 호출을 거부한다.
    service-token: ${TRUST_AGENT_TOOL_SERVICE_TOKEN:}
    service-id: ${TRUST_AGENT_TOOL_SERVICE_ID:ai-service}
  preparation-record:
    # AI 서비스 산출물 기록 경로의 기록 토큰(ADR-012). 읽기 토큰과 별도이며 비어 있으면 모든 기록 호출을 거부한다.
    service-token: ${TRUST_AGENT_PREPARATION_RECORD_TOKEN:}
    service-id: ${TRUST_AGENT_TOOL_SERVICE_ID:ai-service}
  consultation-family-mapping:
    # 상품별 공문군 매핑(합성 시나리오의 사용자 승인 설정) 적재 명령. root는 저장소 루트 또는 datasets 디렉터리.
    enabled: false
  search:
    # Elasticsearch 색인(ADR-013). 재색인 사용자 자격증명은 환경변수로만 제공한다. AI 서비스는 별도 읽기 전용 사용자를 쓴다.
    base-url: ${TRUST_AGENT_ES_URL:http://127.0.0.1:9200}
    username: ${TRUST_AGENT_ES_REINDEX_USERNAME:}
    password: ${TRUST_AGENT_ES_REINDEX_PASSWORD:}
    index-prefix: trustagent-rule-evidence
    workspace-id: ${TRUST_AGENT_SEARCH_WORKSPACE_ID:main}
    analyzer: ${TRUST_AGENT_ES_ANALYZER:standard}
    timeout: ${TRUST_AGENT_ES_TIMEOUT:10s}
  search-reindex:
    # 수동 재색인 명령. 사람 결정·철회 적재 뒤 실행한다.
    enabled: false
  validation-policy:
    max-validation-age: ${TRUST_AGENT_VALIDATION_MAX_AGE:24h}
    policy-version: ${TRUST_AGENT_VALIDATION_POLICY_VERSION:internal-validation-v1}
  schema:
    expected-version: ${TRUST_AGENT_SCHEMA_EXPECTED_VERSION:10}

management:
  server:
    address: ${TRUST_AGENT_MANAGEMENT_ADDRESS:127.0.0.1}
    port: ${TRUST_AGENT_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-components: always
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,databaseConnectivity,schemaCompatibility
