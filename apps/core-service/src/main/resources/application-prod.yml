spring:
  datasource:
    url: ${TRUST_AGENT_DB_URL}
    username: ${TRUST_AGENT_DB_USERNAME}
    password: ${TRUST_AGENT_DB_PASSWORD}

trust-agent:
  public-evidence:
    freshness-policy-version: ${TRUST_AGENT_FRESHNESS_POLICY_VERSION}
    max-confirmation-age: ${TRUST_AGENT_MAX_CONFIRMATION_AGE}
  internal-policy:
    business-timezone: ${TRUST_AGENT_INTERNAL_BUSINESS_TIMEZONE}
    timezone-policy-version: ${TRUST_AGENT_INTERNAL_TIMEZONE_POLICY_VERSION}
  synthetic-internal-import:
    datasource:
      url: ${TRUST_AGENT_SYNTHETIC_IMPORT_DB_URL}
      username: ${TRUST_AGENT_SYNTHETIC_IMPORT_DB_USERNAME}
      password: ${TRUST_AGENT_SYNTHETIC_IMPORT_DB_PASSWORD}
  baseline-import:
    datasource:
      url: ${TRUST_AGENT_IMPORT_DB_URL}
      username: ${TRUST_AGENT_IMPORT_DB_USERNAME}
      password: ${TRUST_AGENT_IMPORT_DB_PASSWORD}
  tool-api:
    service-token: ${TRUST_AGENT_TOOL_SERVICE_TOKEN}
    service-id: ${TRUST_AGENT_TOOL_SERVICE_ID:ai-service}
  preparation-record:
    service-token: ${TRUST_AGENT_PREPARATION_RECORD_TOKEN}
    service-id: ${TRUST_AGENT_TOOL_SERVICE_ID:ai-service}
  search:
    base-url: ${TRUST_AGENT_ES_URL}
    username: ${TRUST_AGENT_ES_REINDEX_USERNAME}
    password: ${TRUST_AGENT_ES_REINDEX_PASSWORD}
    workspace-id: ${TRUST_AGENT_SEARCH_WORKSPACE_ID:main}
    analyzer: ${TRUST_AGENT_ES_ANALYZER:standard}
  validation-policy:
    max-validation-age: ${TRUST_AGENT_VALIDATION_MAX_AGE}
    policy-version: ${TRUST_AGENT_VALIDATION_POLICY_VERSION}
  schema:
    expected-version: ${TRUST_AGENT_SCHEMA_EXPECTED_VERSION}
