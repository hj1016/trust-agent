plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencyLocking {
    lockAllConfigurations()
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// TASK-015 연결 검증: Core(Java)와 AI 서비스(Python CLI)를 함께 실행하는 테스트의 Python 환경 준비.
// 로컬 기본은 명시적 skip이며, -PaiServiceIntegration=true 또는 TRUST_AGENT_REQUIRE_AI_INTEGRATION=1(필수 CI)일 때만 venv를 만든다.
def aiServiceIntegrationRequested = project.hasProperty('aiServiceIntegration')
        ? project.property('aiServiceIntegration').toString() == 'true'
        : (System.getenv('TRUST_AGENT_REQUIRE_AI_INTEGRATION') ?: '') == '1'
// TASK-021 호출 계측 runner(AiServiceCallMetricsRunner)는 -PaiCallMetrics=true일 때만 실행하며 CI에는 넣지 않는다. 실행 수는 -PaiCallMetricsRuns=<N>(기본 30).
def aiCallMetricsRequested = project.hasProperty('aiCallMetrics') && project.property('aiCallMetrics').toString() == 'true'
def aiCallMetricsRuns = project.hasProperty('aiCallMetricsRuns') ? project.property('aiCallMetricsRuns').toString() : '30'
// TASK-016 검색 평가 하네스(SearchEvaluationRunner)는 -PsearchEvaluation=true일 때만 실행하며 CI에는 넣지 않는다.
// 분석기는 -PsearchAnalyzer=standard|nori, 보류 기준 버전 표기는 -PsearchHoldVersion=<버전>(기본 bm25-hold-v1).
def searchEvaluationRequested = project.hasProperty('searchEvaluation') && project.property('searchEvaluation').toString() == 'true'
def searchAnalyzer = project.hasProperty('searchAnalyzer') ? project.property('searchAnalyzer').toString() : 'standard'
def searchHoldVersion = project.hasProperty('searchHoldVersion') ? project.property('searchHoldVersion').toString() : 'bm25-hold-v1'
def searchFuzziness = project.hasProperty('searchFuzziness') ? project.property('searchFuzziness').toString() : ''
def searchDecisionGuard = project.hasProperty('searchDecisionGuard') ? project.property('searchDecisionGuard').toString() : 'off'
def searchMinShouldMatch = project.hasProperty('searchMinShouldMatch') ? project.property('searchMinShouldMatch').toString() : ''
def searchTuningOnly = project.hasProperty('searchTuningOnly') ? project.property('searchTuningOnly').toString() : 'false'
def searchTuningSets = project.hasProperty('searchTuningSets') ? project.property('searchTuningSets').toString() : 'prepayment-fee-smoke-v1'
def aiServiceVenv = layout.buildDirectory.dir('ai-venv')
def aiServiceDir = rootProject.layout.projectDirectory.dir('apps/ai-service')

tasks.register('prepareAiServiceEnv', Exec) {
    description = 'AI 서비스 연결 검증용 Python venv를 만들고 requirements-ai.txt를 설치한다.'
    group = 'verification'
    onlyIf { aiServiceIntegrationRequested || aiCallMetricsRequested || searchEvaluationRequested }
    inputs.file(aiServiceDir.file('requirements-ai.txt'))
    inputs.file(rootProject.layout.projectDirectory.file('requirements.txt'))
    outputs.dir(aiServiceVenv)
    workingDir = rootProject.projectDir
    def venvPath = aiServiceVenv.get().asFile.absolutePath
    def requirements = aiServiceDir.file('requirements-ai.txt').asFile.absolutePath
    commandLine 'sh', '-c',
            "python3 -m venv '${venvPath}' && '${venvPath}/bin/python' -m pip install --quiet --disable-pip-version-check --requirement '${requirements}'"
}

tasks.named('test') {
    useJUnitPlatform()
    // CI 로그로 실제 실행 여부를 확인할 수 있게 한다: skip·실패는 모두, 연결 검증(preparation 패키지)은 통과도 출력하고 끝에 합계를 찍는다.
    testLogging {
        events 'skipped', 'failed'
        exceptionFormat 'short'
    }
    afterTest { descriptor, result ->
        if (descriptor.className?.startsWith('com.trustagent.core.preparation.')) {
            println "TEST ${result.resultType}: ${descriptor.className}.${descriptor.name}"
        }
    }
    afterSuite { descriptor, result ->
        if (descriptor.parent == null) {
            println "TEST SUMMARY: ${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped (${result.resultType})"
        }
    }
    systemProperty 'trustAgent.repositoryRoot', rootProject.projectDir.absolutePath
    systemProperty 'trustAgent.aiServiceIntegration', aiServiceIntegrationRequested.toString()
    systemProperty 'trustAgent.aiServicePython', aiServiceVenv.get().file('bin/python').asFile.absolutePath
    systemProperty 'trustAgent.aiCallMetrics', aiCallMetricsRequested.toString()
    systemProperty 'trustAgent.aiCallMetrics.runs', aiCallMetricsRuns
    systemProperty 'trustAgent.searchEvaluation', searchEvaluationRequested.toString()
    systemProperty 'trustAgent.searchAnalyzer', searchAnalyzer
    systemProperty 'trustAgent.searchHoldVersion', searchHoldVersion
    systemProperty 'trustAgent.searchFuzziness', searchFuzziness
    systemProperty 'trustAgent.searchDecisionGuard', searchDecisionGuard
    systemProperty 'trustAgent.searchTuningSets', searchTuningSets
    systemProperty 'trustAgent.searchMinShouldMatch', searchMinShouldMatch
    systemProperty 'trustAgent.searchTuningOnly', searchTuningOnly
    environment 'TRUST_AGENT_REQUIRE_AI_INTEGRATION', System.getenv('TRUST_AGENT_REQUIRE_AI_INTEGRATION') ?: ''
    if (aiServiceIntegrationRequested || aiCallMetricsRequested || searchEvaluationRequested) {
        dependsOn 'prepareAiServiceEnv'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-Xlint:deprecation')
}
